<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>L2 Telegram 3D MMORPG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем 3D движок Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Подключаем библиотеку для виртуального джойстика -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    
    <style>
        body { background-color: #0c0c0e; color: #d4af37; font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; padding: 0; margin: 0; overflow: hidden; }
        
        #creation-screen { display: none; padding: 10px; }
        .creation-title { font-size: 20px; color: #f1fa8c; margin-bottom: 15px; }
        .class-grid { display: flex; flex-direction: column; gap: 10px; padding: 0 15px; }
        .class-card { background: #18181c; border: 1px solid #443c24; padding: 15px; border-radius: 8px; cursor: pointer; color: #fff; font-weight: bold; }
        
        #game-screen { display: none; width: 100vw; height: 100vh; position: relative; }
        
        /* Контейнер для 3D мира */
        #3d-container { width: 100%; height: 55vh; position: relative; background: #000; border-bottom: 2px solid #d4af37; }
        
        /* Зона для джойстика поверх 3D мира */
        #joystick-zone { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }

        /* Интерфейс (UI) */
        #ui-container { padding: 10px; height: 45vh; overflow-y: auto; background: #0c0c0e; }
        .stats-box { background: #16161a; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #333; text-align: left; font-size: 13px; }
        .stats-box p { margin: 5px 0; }
        .highlight { color: #50fa7b; font-weight: bold; }
        
        .btn { 
            background: linear-gradient(to bottom, #7a1c1c, #4d1010); 
            color: white; padding: 12px; border: 1px solid #d4af37; width: 100%; 
            font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 10px;
        }
        .btn:active { background: #942424; transform: scale(0.98); }
    </style>
</head>
<body>
    <!-- Экран создания персонажа -->
    <div id="creation-screen">
        <div class="creation-title">Создание персонажа</div>
        <div class="class-grid">
            <div class="class-card" onclick="createCharacter('warrior')">⚔️ Воин (Gladiator)</div>
            <div class="class-card" onclick="createCharacter('archer')">🏹 Стрелок (Hawkeye)</div>
            <div class="class-card" onclick="createCharacter('mage')">🔮 Маг (Spellsinger)</div>
            <div class="class-card" onclick="createCharacter('overlord')">📜 Оверлорд (Overlord)</div>
        </div>
    </div>

    <!-- Основной игровой экран -->
    <div id="game-screen">
        
        <!-- Окно 3D движка и джойстик -->
        <div id="3d-container">
            <div id="joystick-zone"></div>
        </div>
        
        <!-- Игровой интерфейс (Меню, статы, кнопки) -->
        <div id="ui-container">
            <button class="btn" onclick="sendAction('attack')">⚔️ Атаковать (Тест)</button>
            
            <div class="stats-box">
                <p>Игрок: <span id="username" class="highlight"></span> [<span id="class_type" style="color:#ffb86c;"></span>]</p>
                <p>Уровень: <span id="level">1</span> | EXP: <span id="exp">0</span></p>
                <p>Адена: <span id="adena" style="color: #f1fa8c;">0</span></p>
                <p>HP: <span id="hp">100</span>/<span id="max_hp">100</span> | MP: <span id="mp">50</span>/<span id="max_mp">50</span></p>
            </div>
            
            <div class="stats-box" id="stats-container"></div>
        </div>
    </div>

    <!-- ЛОГИКА 3D ДВИЖКА (THREE.JS) -->
    <script>
        let scene, camera, renderer, playerMesh;
        let moveVector = { x: 0, z: 0 };
        const playerSpeed = 0.15;

        function init3DWorld() {
            const container = document.getElementById('3d-container');
            
            // 1. Создаем сцену
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a24); // Темный фон
            scene.fog = new THREE.Fog(0x1a1a24, 10, 50); // Туман вдалеке для атмосферы

            // 2. Создаем камеру (вид от 3-го лица)
            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            
            // 3. Создаем рендерер
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // 4. Освещение
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // 5. Создаем пол (Сетка / Grid)
            const gridHelper = new THREE.GridHelper(100, 100, 0xd4af37, 0x444444);
            scene.add(gridHelper);

            // 6. ВРЕМЕННАЯ 3D-модель игрока (Золотой блок, пока не загрузим реального персонажа)
            const geometry = new THREE.BoxGeometry(1, 2, 1);
            const material = new THREE.MeshLambertMaterial({ color: 0xd4af37 });
            playerMesh = new THREE.Mesh(geometry, material);
            playerMesh.position.y = 1; // Поднимаем над землей
            scene.add(playerMesh);

            // 7. Инициализация джойстика
            const joystickZone = document.getElementById('joystick-zone');
            const manager = nipplejs.create({
                zone: joystickZone,
                mode: 'dynamic', // Появляется там, куда нажмет палец
                color: 'white',
                size: 100
            });

            // Обработка движения джойстика
            manager.on('move', function (evt, data) {
                if (data && data.angle) {
                    const angle = data.angle.radian;
                    const force = Math.min(data.force, 1);
                    // Переводим 2D угол джойстика в 3D координаты (X и Z)
                    moveVector.x = Math.cos(angle) * force;
                    moveVector.z = -Math.sin(angle) * force;
                }
            });

            // Остановка при отпускании пальца
            manager.on('end', function () {
                moveVector.x = 0;
                moveVector.z = 0;
            });

            // 8. Запуск цикла анимации
            animate();
        }

        // Цикл рендеринга (60 кадров в секунду)
        function animate() {
            requestAnimationFrame(animate);

            if (playerMesh) {
                // Двигаем игрока, если джойстик нажат
                if (Math.abs(moveVector.x) > 0 || Math.abs(moveVector.z) > 0) {
                    playerMesh.position.x += moveVector.x * playerSpeed;
                    playerMesh.position.z += moveVector.z * playerSpeed;

                    // Поворачиваем персонажа лицом по направлению бега
                    const targetPosition = new THREE.Vector3(
                        playerMesh.position.x + moveVector.x,
                        playerMesh.position.y,
                        playerMesh.position.z + moveVector.z
                    );
                    playerMesh.lookAt(targetPosition);
                }

                // Камера плавно следует за игроком (сверху и сзади)
                camera.position.x = playerMesh.position.x;
                camera.position.y = playerMesh.position.y + 8; // Высота камеры
                camera.position.z = playerMesh.position.z + 10; // Отдаление камеры
                camera.lookAt(playerMesh.position); // Камера смотрит на игрока
            }

            renderer.render(scene, camera);
        }
    </script>

    <!-- СЕРВЕР И ИНТЕРФЕЙС (NETLIFY & SUPABASE) -->
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.disableVerticalSwipes(); // Запрещаем Телеграму закрывать окно при свайпах джойстика

        let user = tg.initDataUnsafe && tg.initDataUnsafe.user;
        let telegramId = user ? user.id.toString() : "123456789";
        let firstName = user ? (user.first_name || "Герой") : "Тестовый Герой";
        const API_URL = '/.netlify/functions/api';

        let is3DInitialized = false;

        function syncWithServer(action = '', classType = '') {
            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: telegramId, username: firstName, action: action, class_type: classType })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    if (data.needs_creation) {
                        document.getElementById('creation-screen').style.display = 'block';
                        document.getElementById('game-screen').style.display = 'none';
                    } else if (data.user) {
                        document.getElementById('creation-screen').style.display = 'none';
                        document.getElementById('game-screen').style.display = 'block';
                        updateUI(data.user);
                        
                        // Запускаем 3D мир только когда игрок успешно вошел в игру
                        if (!is3DInitialized) {
                            init3DWorld();
                            is3DInitialized = true;
                        }
                    }
                }
            })
            .catch(err => console.error('Ошибка:', err));
        }

        function createCharacter(classType) {
            syncWithServer('create', classType);
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        function updateUI(u) {
            document.getElementById('username').innerText = u.username;
            document.getElementById('class_type').innerText = u.class_type.toUpperCase();
            document.getElementById('level').innerText = u.level;
            document.getElementById('exp').innerText = u.exp;
            document.getElementById('adena').innerText = u.adena;
            document.getElementById('hp').innerText = u.hp;
            document.getElementById('max_hp').innerText = u.max_hp;
            document.getElementById('mp').innerText = u.mp;
            document.getElementById('max_mp').innerText = u.max_mp;

            let statsHTML = '';
            if (u.p_atk > 0) {
                statsHTML += `<p>⚔️ P. Atk: <b>${u.p_atk}</b> | 🛡️ P. Def: <b>${u.p_def}</b></p>`;
            } else {
                statsHTML += `<p>🔮 M. Atk: <b>${u.m_atk}</b> | 🛡️ M. Def: <b>${u.m_def}</b></p>`;
            }
            document.getElementById('stats-container').innerHTML = statsHTML;
        }

        function sendAction(actionType) {
            syncWithServer(actionType);
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            
            // Временная анимация прыжка (для теста кнопки атаки)
            if (playerMesh && actionType === 'attack') {
                playerMesh.position.y = 2; // Подпрыгиваем
                setTimeout(() => { playerMesh.position.y = 1; }, 150); // Падаем обратно
            }
        }

        syncWithServer();
    </script>
</body>
</html>
