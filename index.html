<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L2 Telegram MMORPG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем игровой движок Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { background-color: #0c0c0e; color: #d4af37; font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; padding: 10px; margin: 0; }
        .container { max-width: 410px; margin: 0 auto; }
        
        /* Стили экрана создания персонажа */
        #creation-screen { display: none; padding: 10px; }
        .creation-title { font-size: 20px; color: #f1fa8c; margin-bottom: 15px; }
        .class-grid { display: flex; flex-direction: column; gap: 10px; }
        .class-card { background: #18181c; border: 1px solid #443c24; padding: 12px; border-radius: 8px; cursor: pointer; text-align: left; }
        .class-card:hover { border-color: #d4af37; }
        
        /* Игровой интерфейс */
        #game-screen { display: none; }
        
        /* Контейнер для Phaser Canvas */
        #phaser-game-container {
            width: 100%;
            height: 220px;
            margin: 10px 0;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #443c24;
            box-shadow: inset 0 0 20px #000;
        }

        .stats-box { background: #16161a; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #333; text-align: left; font-size: 14px; }
        .stats-box p { margin: 7px 0; }
        .highlight { color: #50fa7b; font-weight: bold; }
        
        .btn { 
            background: linear-gradient(to bottom, #7a1c1c, #4d1010); 
            color: white; padding: 14px; border: 1px solid #d4af37; width: 100%; 
            font-size: 17px; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        .btn:active { background: #942424; transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="container">
        <h2>Lineage II: Phaser Engine</h2>

        <!-- Экран выбора классов -->
        <div id="creation-screen">
            <div class="creation-title">Выбор Пути Героя</div>
            <div class="class-grid">
                <div class="class-card" onclick="createCharacter('warrior')">⚔️ Воин (Gladiator)</div>
                <div class="class-card" onclick="createCharacter('archer')">🏹 Стрелок (Hawkeye)</div>
                <div class="class-card" onclick="createCharacter('mage')">🔮 Маг (Spellsinger)</div>
                <div class="class-card" onclick="createCharacter('overlord')">📜 Оверлорд (Overlord)</div>
            </div>
        </div>

        <!-- Основной экран -->
        <div id="game-screen">
            
            <!-- Сюда Phaser автоматически встроит свой <canvas> -->
            <div id="phaser-game-container"></div>

            <button class="btn" onclick="sendAction('attack')">⚔️ Атаковать моба</button>

            <div class="stats-box">
                <p>Игрок: <span id="username" class="highlight"></span> [<span id="class_type" style="color:#ffb86c;"></span>]</p>
                <p>Уровень: <span id="level">1</span> | EXP: <span id="exp">0</span></p>
                <p>Адена: <span id="adena" style="color: #f1fa8c;">0</span></p>
                <p>HP: <span id="hp">100</span>/<span id="max_hp">100</span> | MP: <span id="mp">50</span>/<span id="max_mp">50</span></p>
            </div>
        </div>
    </div>

    <!-- Логика Phaser (Движок) -->
    <script>
        let gameScene; // Глобальная переменная для управления сценой извне

        class BattleScene extends Phaser.Scene {
            constructor() { super({ key: 'BattleScene' }); }

            preload() {
                // Загружаем фон
                this.load.image('bg', 'https://labs.phaser.io/assets/skies/sky4.png');
                
                // Загружаем тестовые спрайт-листы (картинки, разрезанные на кадры)
                // Игрок (размер кадра 48x48)
                this.load.spritesheet('player_sprite', 'https://labs.phaser.io/assets/sprites/brawler48x48.png', { frameWidth: 48, frameHeight: 48 });
                // Монстр Мумия (размер кадра 37x45)
                this.load.spritesheet('monster_sprite', 'https://labs.phaser.io/assets/sprites/mummy37x45.png', { frameWidth: 37, frameHeight: 45 });
            }

            create() {
                gameScene = this; // Сохраняем ссылку на сцену
                
                // Добавляем фон
                let bg = this.add.image(200, 110, 'bg');
                bg.setScale(1.5);

                // Создаем игрока
                this.player = this.add.sprite(80, 160, 'player_sprite');
                this.player.setScale(2.5); // Увеличиваем масштаб

                // Создаем монстра
                this.monster = this.add.sprite(320, 160, 'monster_sprite');
                this.monster.setScale(2.5);
                this.monster.flipX = true; // Разворачиваем монстра лицом к игроку

                // Создаем анимацию покоя (дыхание) для игрока
                this.anims.create({
                    key: 'idle',
                    frames: this.anims.generateFrameNumbers('player_sprite', { start: 0, end: 3 }),
                    frameRate: 6,
                    repeat: -1 // Зациклить
                });

                // Создаем анимацию атаки для игрока
                this.anims.create({
                    key: 'attack',
                    frames: this.anims.generateFrameNumbers('player_sprite', { start: 20, end: 23 }),
                    frameRate: 15,
                    repeat: 0 // Отыграть 1 раз
                });

                // Анимация ходьбы для монстра
                this.anims.create({
                    key: 'monster_idle',
                    frames: this.anims.generateFrameNumbers('monster_sprite', { start: 0, end: 17 }),
                    frameRate: 12,
                    repeat: -1
                });

                // Запускаем базовые анимации
                this.player.play('idle');
                this.monster.play('monster_idle');
            }

            // Функция, которую мы будем вызывать при нажатии кнопки "Атаковать"
            playAttackAnimation() {
                // Запускаем анимацию удара
                this.player.play('attack');
                
                // Двигаем игрока вперед к мобу с помощью Tweens (Плавная анимация)
                this.tweens.add({
                    targets: this.player,
                    x: 120, // Прыгаем вперед
                    duration: 150,
                    yoyo: true, // Возвращаемся обратно
                    onComplete: () => {
                        this.player.play('idle'); // Возвращаемся в стойку
                        this.showDamageText(this.monster.x, this.monster.y - 50, "-15"); // Показываем урон
                    }
                });
            }

            // Красиво всплывающий текст урона
            showDamageText(x, y, text) {
                let dmgText = this.add.text(x, y, text, { font: 'bold 20px Arial', fill: '#ff0000', stroke: '#000000', strokeThickness: 4 });
                this.tweens.add({
                    targets: dmgText,
                    y: y - 40,
                    alpha: 0,
                    duration: 800,
                    onComplete: () => { dmgText.destroy(); }
                });
            }
        }

        // Конфигурация движка Phaser
        const config = {
            type: Phaser.AUTO,
            parent: 'phaser-game-container', // ID нашего div'а
            width: 400,
            height: 220,
            transparent: true,
            scene: BattleScene // Подключаем сцену
        };

        const game = new Phaser.Game(config);
    </script>

    <!-- Логика сервера (Netlify API) -->
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let user = tg.initDataUnsafe && tg.initDataUnsafe.user;
        let telegramId = user ? user.id.toString() : "123456789";
        let firstName = user ? (user.first_name || "Герой") : "Тестовый Герой";
        const API_URL = '/.netlify/functions/api';

        function syncWithServer(action = '', classType = '') {
            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: telegramId, username: firstName, action: action, class_type: classType })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    if (data.needs_creation) {
                        document.getElementById('creation-screen').style.display = 'block';
                        document.getElementById('game-screen').style.display = 'none';
                    } else if (data.user) {
                        document.getElementById('creation-screen').style.display = 'none';
                        document.getElementById('game-screen').style.display = 'block';
                        updateUI(data.user);
                    }
                }
            })
            .catch(err => console.error('Ошибка:', err));
        }

        function createCharacter(classType) {
            syncWithServer('create', classType);
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        function updateUI(u) {
            document.getElementById('username').innerText = u.username;
            document.getElementById('class_type').innerText = u.class_type.toUpperCase();
            document.getElementById('level').innerText = u.level;
            document.getElementById('exp').innerText = u.exp;
            document.getElementById('adena').innerText = u.adena;
            document.getElementById('hp').innerText = u.hp;
            document.getElementById('max_hp').innerText = u.max_hp;
            document.getElementById('mp').innerText = u.mp;
            document.getElementById('max_mp').innerText = u.max_mp;
        }

        function sendAction(actionType) {
            syncWithServer(actionType); // Сохраняем в базу данных
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            
            // Если сцена Phaser загрузилась, вызываем анимацию
            if (gameScene && actionType === 'attack') {
                gameScene.playAttackAnimation();
            }
        }

        syncWithServer();
    </script>
</body>
</html>
