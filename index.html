<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L2 Telegram MMORPG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { background-color: #0c0c0e; color: #d4af37; font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; padding: 10px; margin: 0; }
        .container { max-width: 410px; margin: 0 auto; }
        
        #creation-screen { display: none; padding: 10px; }
        .creation-title { font-size: 20px; color: #f1fa8c; margin-bottom: 15px; }
        .class-grid { display: flex; flex-direction: column; gap: 15px; }
        
        .class-card { background: linear-gradient(145deg, #18181c, #111115); border: 1px solid #443c24; border-radius: 10px; cursor: pointer; text-align: left; overflow: hidden; }
        .class-card:hover { border-color: #d4af37; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(212,175,55,0.2); }
        
        /* Стили для картинок в меню создания */
        .class-image { width: 100%; height: 140px; object-fit: contain; background-color: #000; border-bottom: 1px solid #443c24; padding: 5px 0; }
        .class-info { padding: 10px 15px; }
        .class-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 16px; color: #ffb86c; }
        .class-tag-phys { color: #50fa7b; font-size: 11px; background: rgba(80,250,123,0.1); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(80,250,123,0.3); }
        .class-tag-mag { color: #8be9fd; font-size: 11px; background: rgba(139,233,253,0.1); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(139,233,253,0.3); }
        .class-desc { font-size: 12px; color: #aaa; margin-top: 6px; }

        #game-screen { display: none; }
        
        #phaser-game-container {
            width: 100%; height: 220px; margin: 10px 0; border-radius: 10px; overflow: hidden;
            border: 2px solid #443c24; box-shadow: inset 0 0 20px #000;
        }

        .stats-box { background: #16161a; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #333; text-align: left; font-size: 14px; }
        .stats-box p { margin: 7px 0; }
        .highlight { color: #50fa7b; font-weight: bold; }
        
        .btn { 
            background: linear-gradient(to bottom, #7a1c1c, #4d1010); 
            color: white; padding: 14px; border: 1px solid #d4af37; width: 100%; 
            font-size: 17px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 10px;
        }
        .btn:active { background: #942424; transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin-bottom: 15px;">Lineage II: Visual</h2>

        <!-- Экран выбора классов (теперь с вашими картинками) -->
        <div id="creation-screen">
            <div class="creation-title">Выбор Пути Героя</div>
            <div class="class-grid">
                
                <div class="class-card" onclick="createCharacter('warrior')">
                    <img src="img/humanvoin.png" class="class-image">
                    <div class="class-info">
                        <div class="class-header"><span>⚔️ Воин</span><span class="class-tag-phys">Физ. ДД</span></div>
                        <div class="class-desc">Тяжелая броня и огромный урон.</div>
                    </div>
                </div>
                
                <div class="class-card" onclick="createCharacter('archer')">
                    <img src="img/elfluk.png" class="class-image">
                    <div class="class-info">
                        <div class="class-header"><span>🏹 Стрелок</span><span class="class-tag-phys">Физ. ДД</span></div>
                        <div class="class-desc">Молниеносные атаки из лука.</div>
                    </div>
                </div>

                <div class="class-card" onclick="createCharacter('mage')">
                    <img src="img/humanmaq.png" class="class-image">
                    <div class="class-info">
                        <div class="class-header"><span>🔮 Маг</span><span class="class-tag-mag">Маг. ДД</span></div>
                        <div class="class-desc">Сокрушительная магия стихий.</div>
                    </div>
                </div>

                <div class="class-card" onclick="createCharacter('overlord')">
                    <img src="img/qaraelftx.png" class="class-image">
                    <div class="class-info">
                        <div class="class-header"><span>📜 Оверлорд</span><span class="class-tag-mag">Саппорт</span></div>
                        <div class="class-desc">Темные искусства и проклятия.</div>
                    </div>
                </div>

            </div>
        </div>

        <div id="game-screen">
            <div id="phaser-game-container"></div>
            <button class="btn" onclick="sendAction('attack')">⚔️ Атаковать моба</button>
            
            <div class="stats-box">
                <p>Игрок: <span id="username" class="highlight"></span> [<span id="class_type" style="color:#ffb86c;"></span>]</p>
                <p>Уровень: <span id="level">1</span> | EXP: <span id="exp">0</span></p>
                <p>Адена: <span id="adena" style="color: #f1fa8c;">0</span></p>
                <p>HP: <span id="hp">100</span>/<span id="max_hp">100</span> | MP: <span id="mp">50</span>/<span id="max_mp">50</span></p>
            </div>
            
            <div class="stats-box" id="stats-container"></div>
        </div>
    </div>

    <!-- ДВИЖОК PHASER -->
    <script>
        let gameScene;

        class BattleScene extends Phaser.Scene {
            constructor() { super({ key: 'BattleScene' }); }

            preload() {
                // Загружаем фон (если его нет в папке img, будет черный цвет)
                this.load.image('bg', 'img/bg-arena.jpg'); 
                
                // ЗАГРУЖАЕМ ВСЕ ВАШИ КАРТИНКИ
                this.load.image('warrior', 'img/humanvoin.png'); 
                this.load.image('archer', 'img/elfluk.png'); 
                this.load.image('mage', 'img/humanmaq.png'); 
                this.load.image('overlord', 'img/qaraelftx.png'); 
                this.load.image('gremlin', 'img/gremlin.png'); 
            }

            create() {
                gameScene = this;
                
                this.cameras.main.setBackgroundColor('#1a1a24');

                // Пытаемся добавить фон
                try {
                    let bg = this.add.image(200, 110, 'bg');
                    bg.setDisplaySize(400, 220); 
                } catch(e) {}

                // Создаем игрока (по умолчанию ставим воина, но он сразу поменяется сервером)
                this.player = this.add.image(90, 200, 'warrior');
                this.player.setOrigin(0.5, 1); // Ногами на пол
                this.fitToHeight(this.player, 120); 

                // Создаем монстра (Гремлин)
                this.monster = this.add.image(310, 200, 'gremlin');
                this.monster.setOrigin(0.5, 1);
                this.monster.flipX = true; // Лицом к игроку
                this.fitToHeight(this.monster, 110);

                // Анимация дыхания
                this.tweens.add({
                    targets: [this.player, this.monster],
                    scaleY: { value: '-=0.03' }, 
                    scaleX: { value: '+=0.01' },
                    duration: 1500,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut'
                });
            }

            // ДИНАМИЧЕСКОЕ ИЗМЕНЕНИЕ КЛАССА
            setPlayerClass(classType) {
                if (this.textures.exists(classType)) {
                    this.player.setTexture(classType);
                    this.fitToHeight(this.player, 120); // Заново подгоняем размер под новую картинку
                }
            }

            fitToHeight(sprite, targetHeight) {
                if (sprite.height > 0) {
                    let ratio = targetHeight / sprite.height;
                    sprite.setScale(ratio);
                }
            }

            playAttackAnimation() {
                this.tweens.add({
                    targets: this.player,
                    x: 140, // Рывок
                    duration: 100,
                    yoyo: true,
                    ease: 'Power2',
                    onComplete: () => {
                        this.showDamage(this.monster.x, this.monster.y - this.monster.displayHeight + 20, "-15");
                        
                        this.monster.setTint(0xff0000);
                        setTimeout(() => this.monster.clearTint(), 150);
                        
                        this.tweens.add({
                            targets: this.monster,
                            x: { from: 310, to: 318 }, // Отброс
                            duration: 40,
                            yoyo: true,
                            repeat: 2
                        });
                    }
                });
            }

            showDamage(x, y, text) {
                let dmgText = this.add.text(x, y, text, { font: 'bold 24px Arial', fill: '#ff4444', stroke: '#000000', strokeThickness: 5 });
                dmgText.setOrigin(0.5, 0.5);
                
                this.tweens.add({
                    targets: dmgText,
                    y: y - 60,
                    scale: { from: 0.5, to: 1.2 },
                    alpha: { from: 1, to: 0 },
                    duration: 700,
                    ease: 'Cubic.easeOut',
                    onComplete: () => { dmgText.destroy(); }
                });
            }
        }

        const config = {
            type: Phaser.AUTO,
            parent: 'phaser-game-container',
            width: 400,
            height: 220,
            transparent: true,
            scene: BattleScene
        };
        const game = new Phaser.Game(config);
    </script>

    <!-- СЕРВЕР И ИНТЕРФЕЙС -->
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let user = tg.initDataUnsafe && tg.initDataUnsafe.user;
        let telegramId = user ? user.id.toString() : "123456789";
        let firstName = user ? (user.first_name || "Герой") : "Тестовый Герой";
        const API_URL = '/.netlify/functions/api';

        function syncWithServer(action = '', classType = '') {
            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: telegramId, username: firstName, action: action, class_type: classType })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    if (data.needs_creation) {
                        document.getElementById('creation-screen').style.display = 'block';
                        document.getElementById('game-screen').style.display = 'none';
                    } else if (data.user) {
                        document.getElementById('creation-screen').style.display = 'none';
                        document.getElementById('game-screen').style.display = 'block';
                        updateUI(data.user);
                    }
                }
            })
            .catch(err => console.error('Ошибка:', err));
        }

        function createCharacter(classType) {
            syncWithServer('create', classType);
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        function updateUI(u) {
            document.getElementById('username').innerText = u.username;
            document.getElementById('class_type').innerText = u.class_type.toUpperCase();
            document.getElementById('level').innerText = u.level;
            document.getElementById('exp').innerText = u.exp;
            document.getElementById('adena').innerText = u.adena;
            document.getElementById('hp').innerText = u.hp;
            document.getElementById('max_hp').innerText = u.max_hp;
            document.getElementById('mp').innerText = u.mp;
            document.getElementById('max_mp').innerText = u.max_mp;

            let statsHTML = '';
            if (u.p_atk > 0) {
                statsHTML += `<p>⚔️ P. Atk: <b>${u.p_atk}</b> | 🛡️ P. Def: <b>${u.p_def}</b></p>`;
                statsHTML += `<p>⚡ Atk. Speed: <b>${u.p_atk_speed}</b> | 🎯 Crit: <b>${u.crit}%</b></p>`;
            } else {
                statsHTML += `<p>🔮 M. Atk: <b>${u.m_atk}</b> | 🛡️ M. Def: <b>${u.m_def}</b></p>`;
                statsHTML += `<p>🌀 Cast. Speed: <b>${u.m_cast_speed}</b> | 🎯 Crit: <b>${u.crit}%</b></p>`;
            }
            document.getElementById('stats-container').innerHTML = statsHTML;

            // ГЛАВНАЯ МАГИЯ: Заставляем движок переключить картинку на арене!
            if (gameScene) {
                gameScene.setPlayerClass(u.class_type);
            }
        }

        function sendAction(actionType) {
            syncWithServer(actionType);
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            
            if (gameScene && actionType === 'attack') {
                gameScene.playAttackAnimation();
            }
        }

        syncWithServer();
    </script>
</body>
</html>
