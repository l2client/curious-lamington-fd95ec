<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L2 Telegram Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #1a1a1a; color: #d4af37; font-family: sans-serif; text-align: center; padding-top: 20px; }
        .stats { background: #2a2a2a; padding: 15px; margin: 10px auto; width: 80%; border-radius: 8px; border: 1px solid #444; }
        .btn { background: #5c1818; color: white; padding: 15px; border: 1px solid #d4af37; width: 85%; margin-top: 20px; font-size: 18px; border-radius: 5px; cursor: pointer; }
        .btn:active { background: #7c2222; }
    </style>
</head>
<body>
    <h1>Убить Гремлина</h1>
    
    <div class="stats">
        <p>Игрок: <span id="username">Загрузка...</span></p>
        <p>Уровень: <span id="level">1</span> | EXP: <span id="exp">0</span></p>
        <p>Адена: <span id="adena">0</span></p>
        <p>HP: <span id="hp">100</span>/<span id="max_hp">100</span></p>
    </div>

    <button class="btn" onclick="sendAction('attack')">Атаковать моба</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe && tg.initDataUnsafe.user;
        let telegramId = user ? user.id : 123456789;
        let firstName = user ? (user.first_name || "Герой") : "Тестовый Герой";

        // Запрос идет на ваш собственный эндпоинт Netlify
        const API_URL = '/.netlify/functions/api';

        function syncWithServer(action = '') {
            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    telegram_id: telegramId,
                    username: firstName,
                    action: action
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    updateUI(data.user);
                }
            })
            .catch(err => console.error('Ошибка:', err));
        }

        function updateUI(userData) {
            document.getElementById('username').innerText = userData.username;
            document.getElementById('level').innerText = userData.level;
            document.getElementById('exp').innerText = userData.exp;
            document.getElementById('adena').innerText = userData.adena;
            document.getElementById('hp').innerText = userData.hp;
            document.getElementById('max_hp').innerText = userData.max_hp;
        }

        function sendAction(actionType) {
            syncWithServer(actionType);
            tg.HapticFeedback.impactOccurred('medium');
        }

        syncWithServer();
    </script>
</body>
</html>
