<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>L2 Telegram 3D MMORPG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    
    <style>
        body { background-color: #000; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; overflow: hidden; user-select: none; }
        
        /* Экран создания */
        #creation-screen { display: none; padding: 20px; text-align: center; position: relative; z-index: 100; }
        .creation-title { font-size: 22px; color: #f1fa8c; margin-bottom: 20px; }
        .class-grid { display: flex; flex-direction: column; gap: 12px; }
        .class-card { background: #18181c; border: 1px solid #d4af37; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        /* Игровой экран */
        #game-screen { display: none; width: 100vw; height: 100vh; position: relative; }
        
        /* 1. ФОНОВЫЙ 3D-МИР (Заполняет весь экран) */
        #3d-canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        /* 2. ЗОНА ДЖОЙСТИКА (Только левая нижняя четверть экрана) */
        #joystick-zone { position: absolute; bottom: 0; left: 0; width: 50vw; height: 50vh; z-index: 5; }

        /* 3. ИНТЕРФЕЙС ПОВЕРХ 3D-МИРА */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; } /* Чтобы кнопки можно было нажимать */

        /* Статы в левом верхнем углу */
        .stats-panel { position: absolute; top: 10px; left: 10px; background: rgba(0, 0, 0, 0.6); padding: 8px 12px; border-radius: 8px; border: 1px solid #443c24; font-size: 12px; }
        .stats-panel p { margin: 4px 0; }
        .highlight { color: #50fa7b; font-weight: bold; }

        /* Главное меню в правом верхнем углу (Инвентарь, Магазин) */
        .top-menu { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; }
        .menu-btn { background: rgba(20, 20, 20, 0.8); color: #d4af37; border: 1px solid #d4af37; padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .menu-btn:active { background: #d4af37; color: #000; }

        /* Боевые кнопки в правом нижнем углу */
        .action-panel { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
        .attack-btn { 
            background: radial-gradient(circle, #7a1c1c, #4d1010); 
            color: white; border: 2px solid #d4af37; width: 75px; height: 75px; 
            border-radius: 50%; font-size: 14px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            display: flex; justify-content: center; align-items: center; text-align: center;
        }
        .attack-btn:active { transform: scale(0.9); box-shadow: 0 0 25px rgba(212, 175, 55, 0.6); }
    </style>
</head>
<body>

    <!-- Меню создания -->
    <div id="creation-screen">
        <div class="creation-title">Выбор Пути Героя</div>
        <div class="class-grid">
            <div class="class-card" onclick="createCharacter('warrior')">⚔️ Воин (Gladiator)</div>
            <div class="class-card" onclick="createCharacter('archer')">🏹 Стрелок (Hawkeye)</div>
            <div class="class-card" onclick="createCharacter('mage')">🔮 Маг (Spellsinger)</div>
            <div class="class-card" onclick="createCharacter('overlord')">📜 Оверлорд (Overlord)</div>
        </div>
    </div>

    <!-- Игровой мир -->
    <div id="game-screen">
        
        <!-- 1. 3D Движок -->
        <div id="3d-canvas-container"></div>
        
        <!-- 2. Зона для пальца (Джойстик появится только тут) -->
        <div id="joystick-zone"></div>
        
        <!-- 3. UI Интерфейс -->
        <div id="ui-layer">
            
            <!-- Статы (Слева вверху) -->
            <div class="stats-panel interactive">
                <p><span id="username" class="highlight"></span> [<span id="class_type" style="color:#ffb86c;"></span>]</p>
                <p>Ур: <span id="level">1</span> | EXP: <span id="exp">0</span></p>
                <p style="color: #f1fa8c;">Адена: <span id="adena">0</span></p>
                <p style="color: #ff5555;">HP: <span id="hp">100</span>/<span id="max_hp">100</span></p>
                <p style="color: #5555ff;">MP: <span id="mp">50</span>/<span id="max_mp">50</span></p>
            </div>

            <!-- Игровое меню (Справа вверху) -->
            <div class="top-menu interactive">
                <button class="menu-btn" onclick="alert('Открыт Инвентарь!')">🎒 Инвентарь</button>
                <button class="menu-btn" onclick="alert('Открыт Магазин!')">⚖️ Магазин</button>
            </div>

            <!-- Кнопки действий (Справа внизу) -->
            <div class="action-panel interactive">
                <button class="attack-btn" onclick="sendAction('attack')">⚔️<br>Удар</button>
            </div>
            
        </div>
    </div>

    <!-- THREE.JS Скрипт -->
    <script>
        let scene, camera, renderer, playerMesh;
        let moveVector = { x: 0, z: 0 };
        const playerSpeed = 0.12;

        function init3DWorld() {
            const container = document.getElementById('3d-canvas-container');
            
            // Сцена и туман
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111118);
            scene.fog = new THREE.Fog(0x111118, 15, 60); 

            // Камера
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // Рендерер
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Свет
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // Пол (Бесконечная сетка)
            const gridHelper = new THREE.GridHelper(200, 200, 0x443c24, 0x222222);
            scene.add(gridHelper);

            // Временный Игрок (Золотой блок)
            const geometry = new THREE.BoxGeometry(1, 2, 1);
            const material = new THREE.MeshLambertMaterial({ color: 0xd4af37 });
            playerMesh = new THREE.Mesh(geometry, material);
            playerMesh.position.y = 1;
            scene.add(playerMesh);

            // Джойстик (Только в левой зоне)
            const joystickZone = document.getElementById('joystick-zone');
            const manager = nipplejs.create({
                zone: joystickZone,
                mode: 'dynamic', 
                color: 'white',
                size: 120,
                opacity: 0.5
            });

            manager.on('move', function (evt, data) {
                if (data && data.angle) {
                    const angle = data.angle.radian;
                    const force = Math.min(data.force, 1.5) / 1.5;
                    moveVector.x = Math.cos(angle) * force;
                    moveVector.z = -Math.sin(angle) * force;
                }
            });

            manager.on('end', function () {
                moveVector.x = 0;
                moveVector.z = 0;
            });

            // Автоматическая подгонка экрана при перевороте телефона
            window.addEventListener('resize', onWindowResize, false);
            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            if (playerMesh) {
                if (Math.abs(moveVector.x) > 0 || Math.abs(moveVector.z) > 0) {
                    playerMesh.position.x += moveVector.x * playerSpeed;
                    playerMesh.position.z += moveVector.z * playerSpeed;

                    const targetPosition = new THREE.Vector3(
                        playerMesh.position.x + moveVector.x,
                        playerMesh.position.y,
                        playerMesh.position.z + moveVector.z
                    );
                    playerMesh.lookAt(targetPosition);
                }

                // Улучшенная позиция камеры (как в мобильных RPG)
                camera.position.x = playerMesh.position.x;
                camera.position.y = playerMesh.position.y + 12; // Высота над головой
                camera.position.z = playerMesh.position.z + 14; // Отдаление
                camera.lookAt(playerMesh.position);
            }

            renderer.render(scene, camera);
        }
    </script>

    <!-- СЕРВЕР И ИНТЕРФЕЙС -->
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.disableVerticalSwipes(); 

        let user = tg.initDataUnsafe && tg.initDataUnsafe.user;
        let telegramId = user ? user.id.toString() : "123456789";
        let firstName = user ? (user.first_name || "Герой") : "Тестовый Герой";
        const API_URL = '/.netlify/functions/api';
        let is3DInitialized = false;

        function syncWithServer(action = '', classType = '') {
            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: telegramId, username: firstName, action: action, class_type: classType })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    if (data.needs_creation) {
                        document.getElementById('creation-screen').style.display = 'block';
                        document.getElementById('game-screen').style.display = 'none';
                    } else if (data.user) {
                        document.getElementById('creation-screen').style.display = 'none';
                        document.getElementById('game-screen').style.display = 'block';
                        updateUI(data.user);
                        
                        if (!is3DInitialized) {
                            init3DWorld();
                            is3DInitialized = true;
                        }
                    }
                }
            })
            .catch(err => console.error('Ошибка:', err));
        }

        function createCharacter(classType) {
            syncWithServer('create', classType);
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        function updateUI(u) {
            document.getElementById('username').innerText = u.username;
            document.getElementById('class_type').innerText = u.class_type.toUpperCase();
            document.getElementById('level').innerText = u.level;
            document.getElementById('exp').innerText = u.exp;
            document.getElementById('adena').innerText = u.adena;
            document.getElementById('hp').innerText = u.hp;
            document.getElementById('max_hp').innerText = u.max_hp;
            document.getElementById('mp').innerText = u.mp;
            document.getElementById('max_mp').innerText = u.max_mp;
        }

        function sendAction(actionType) {
            syncWithServer(actionType);
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            
            // Временная анимация удара кубика
            if (playerMesh && actionType === 'attack') {
                playerMesh.rotation.y += Math.PI * 2; // Круговой удар
                playerMesh.position.y = 2; 
                setTimeout(() => { playerMesh.position.y = 1; }, 150); 
            }
        }

        syncWithServer();
    </script>
</body>
</html>
