<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>L2 Telegram 3D MMORPG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    
    <style>
        body { background-color: #000; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; overflow: hidden; user-select: none; touch-action: none; }
        
        /* СТАРТОВЫЙ ЭКРАН */
        #start-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; background: #0c0c0e; z-index: 10000; }
        .start-logo { font-size: 32px; color: #d4af37; font-weight: bold; margin-bottom: 40px; text-shadow: 0 0 20px rgba(212, 175, 55, 0.6); text-transform: uppercase; letter-spacing: 2px;}
        .play-btn { background: radial-gradient(circle, #7a1c1c, #300000); border: 2px solid #d4af37; color: #fff; font-size: 24px; font-weight: bold; padding: 20px 60px; border-radius: 12px; cursor: pointer; box-shadow: 0 0 30px rgba(212, 175, 55, 0.4); }

        /* ЭКРАН СОЗДАНИЯ */
        #creation-screen { display: none; flex-direction: column; justify-content: center; align-items: center; width: 100vw; height: 100vh; padding: 20px; box-sizing: border-box; background: #000; position: fixed; top: 0; left: 0; z-index: 100; }
        .creation-title { font-size: 28px; color: #f1fa8c; margin-bottom: 30px; }
        .class-grid { display: flex; flex-direction: row; gap: 20px; }
        .class-card { background: #18181c; border: 2px solid #d4af37; padding: 20px 40px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 18px; }
        
        /* ИГРОВОЙ ЭКРАН */
        #game-screen { display: none; width: 100vw; height: 100vh; position: relative; }
        #3d-canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        #camera-zone { position: absolute; top: 0; right: 0; width: 60vw; height: 100vh; z-index: 4; } 
        #joystick-zone { position: absolute; bottom: 0; left: 0; width: 40vw; height: 100vh; z-index: 5; } 

        #ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; } 

        /* HUD ИГРОКА */
        .player-hud { position: absolute; top: 15px; left: 15px; display: flex; align-items: center; gap: 12px; background: linear-gradient(90deg, rgba(15,15,20,0.95) 0%, rgba(15,15,20,0.6) 100%); padding: 6px 20px 6px 6px; border-radius: 40px 10px 10px 40px; border: 1px solid #332d1f; border-left: 2px solid #d4af37; box-shadow: 0 4px 10px rgba(0,0,0,0.7); }
        .avatar-box { position: relative; width: 56px; height: 56px; }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #7a6b42; object-fit: cover; background: #222; }
        .level-badge { position: absolute; bottom: -4px; right: -4px; background: linear-gradient(180deg, #f1fa8c, #d4af37); color: #000; font-size: 11px; font-weight: 900; width: 22px; height: 22px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 2px solid #111; }
        .hud-info { display: flex; flex-direction: column; gap: 4px; min-width: 140px; }
        .hud-name { font-size: 14px; font-weight: bold; color: #fff; }
        .hud-class { color: #8be9fd; font-size: 10px; margin-left: 5px; }
        .bar-container { position: relative; width: 100%; height: 14px; background: #1a1a1a; border-radius: 3px; border: 1px solid #000; overflow: hidden; }
        .bar-fill { height: 100%; transition: width 0.3s ease; }
        .hp-fill { background: linear-gradient(180deg, #ff5555 0%, #aa0000 100%); }
        .mp-fill { background: linear-gradient(180deg, #5555ff 0%, #0000aa 100%); }
        .bar-text { position: absolute; width: 100%; text-align: center; font-size: 10px; font-weight: bold; line-height: 14px; color: #fff; }
        .hud-extra { display: flex; justify-content: space-between; font-size: 11px; color: #bbb; margin-top: 2px; font-weight: bold; }
        .hud-adena { color: #f1fa8c; }

        /* МЕНЮ */
        .top-menu { position: absolute; top: 15px; right: 15px; display: flex; gap: 8px; }
        .menu-btn { background: rgba(20, 20, 25, 0.85); color: #d4af37; border: 1px solid #5a5035; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }

        /* 4 ЯЧЕЙКИ */
        .quick-slots { position: absolute; bottom: 230px; right: 25px; display: flex; gap: 12px; }
        .q-slot { width: 48px; height: 48px; background: rgba(20, 20, 25, 0.75); border: 1px solid #7a6b42; border-radius: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 24px; position: relative; }
        .q-count { position: absolute; bottom: 3px; right: 5px; font-size: 11px; font-weight: 900; color: #fff; }

        /* КРУГОВОЙ БЛОК СКИЛЛОВ */
        .skill-cluster { position: absolute; bottom: 30px; right: 30px; width: 220px; height: 220px; }
        .action-btn { position: absolute; border-radius: 50%; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; border: 2px solid #7a6b42; color: white; }
        .attack-main { width: 95px; height: 95px; bottom: 0; right: 0; font-size: 42px; border-color: #d4af37; background: radial-gradient(circle, #8f2020, #300000); }
        .spell-1 { width: 65px; height: 65px; bottom: 5px; right: 125px; font-size: 28px; background: radial-gradient(circle, #224b75, #00102d); }
        .spell-2 { width: 65px; height: 65px; bottom: 95px; right: 105px; font-size: 28px; background: radial-gradient(circle, #754b22, #2d1000); }
        .spell-3 { width: 65px; height: 65px; bottom: 125px; right: 15px; font-size: 28px; background: radial-gradient(circle, #22753a, #002d0a); }
    </style>
</head>
<body>

    <!-- СТАРТОВЫЙ ЭКРАН -->
    <div id="start-screen">
        <div class="start-logo">Lineage II Mobile</div>
        <button class="play-btn" onpointerdown="enterGame()">▶ ВОЙТИ В МИР</button>
    </div>

    <!-- ЭКРАН СОЗДАНИЯ -->
    <div id="creation-screen">
        <div class="creation-title">Выбор Пути Героя</div>
        <div class="class-grid">
            <div class="class-card" onpointerdown="createCharacter('warrior')">⚔️ Воин</div>
            <div class="class-card" onpointerdown="createCharacter('archer')">🏹 Стрелок</div>
            <div class="class-card" onpointerdown="createCharacter('mage')">🔮 Маг</div>
            <div class="class-card" onpointerdown="createCharacter('overlord')">📜 Оверлорд</div>
        </div>
    </div>

    <!-- ИГРОВОЙ ЭКРАН -->
    <div id="game-screen">
        <div id="3d-canvas-container"></div>
        <div id="camera-zone"></div>
        <div id="joystick-zone"></div>
        
        <div id="ui-layer">
            <div class="player-hud interactive">
                <div class="avatar-box"><img id="hud-avatar" src="https://via.placeholder.com/60" class="avatar-img"><div class="level-badge" id="level">1</div></div>
                <div class="hud-info">
                    <div class="hud-name"><span id="username">Герой</span><span id="class_type" class="hud-class">MAGE</span></div>
                    <div class="bar-container"><div class="bar-fill hp-fill" id="hp-bar-width" style="width: 100%;"></div><div class="bar-text"><span id="hp">100</span> / <span id="max_hp">100</span></div></div>
                    <div class="bar-container"><div class="bar-fill mp-fill" id="mp-bar-width" style="width: 100%;"></div><div class="bar-text"><span id="mp">50</span> / <span id="max_mp">50</span></div></div>
                    <div class="hud-extra"><span class="hud-adena">💎 <span id="adena">0</span></span><span>EXP: <span id="exp">0</span></span></div>
                </div>
            </div>

            <div class="top-menu interactive">
                <div class="menu-btn" onpointerdown="alert('Инвентарь')">🎒 Инвентарь</div>
                <div class="menu-btn" onpointerdown="alert('Магазин')">⚖️ Магазин</div>
            </div>

            <div class="quick-slots interactive">
                <div class="q-slot" onpointerdown="useItem('hp')">❤️<span class="q-count">50</span></div>
                <div class="q-slot" onpointerdown="useItem('mp')">💙<span class="q-count">30</span></div>
                <div class="q-slot" onpointerdown="useItem('scroll')">📜<span class="q-count">5</span></div>
                <div class="q-slot" onpointerdown="useItem('buff')">💪<span class="q-count">10</span></div>
            </div>

            <div class="skill-cluster interactive">
                <div class="action-btn spell-1" onpointerdown="useSkill(1)">⚡</div>
                <div class="action-btn spell-2" onpointerdown="useSkill(2)">🔥</div>
                <div class="action-btn spell-3" onpointerdown="useSkill(3)">🛡️</div>
                <div class="action-btn attack-main" onpointerdown="sendAction('attack')">⚔️</div>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.disableVerticalSwipes();

        function enterGame() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
            try {
                if (tg.requestFullscreen) tg.requestFullscreen();
            } catch (e) {}
            document.getElementById('start-screen').style.display = 'none';
            syncWithServer();
        }

        let scene, camera, renderer, playerMesh;
        let moveVector = { x: 0, z: 0 };
        const playerSpeed = 0.12;
        let cameraAngleX = 0; let cameraAngleY = 0.6; const cameraDistance = 14; 

        function init3DWorld() {
            const container = document.getElementById('3d-canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111118);
            scene.fog = new THREE.Fog(0x111118, 15, 60); 

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            const gridHelper = new THREE.GridHelper(200, 200, 0x443c24, 0x222222);
            scene.add(gridHelper);

            const geometry = new THREE.BoxGeometry(1, 2, 1);
            const material = new THREE.MeshLambertMaterial({ color: 0xd4af37 });
            playerMesh = new THREE.Mesh(geometry, material);
            playerMesh.position.y = 1;
            scene.add(playerMesh);

            const joystickZone = document.getElementById('joystick-zone');
            const manager = nipplejs.create({ zone: joystickZone, mode: 'dynamic', color: 'white', size: 120, opacity: 0.5 });
            manager.on('move', function (evt, data) {
                if (data && data.angle) {
                    const angle = data.angle.radian;
                    const force = Math.min(data.force, 1.5) / 1.5;
                    moveVector.x = Math.cos(angle) * force;
                    moveVector.z = -Math.sin(angle) * force;
                }
            });
            manager.on('end', function () { moveVector.x = 0; moveVector.z = 0; });

            const cameraZone = document.getElementById('camera-zone');
            let activeTouchId = null;
            let previousTouch = { x: 0, y: 0 };

            cameraZone.addEventListener('touchstart', function(e) {
                e.preventDefault(); 
                if (activeTouchId !== null) return; 
                const touch = e.changedTouches[0];
                activeTouchId = touch.identifier;
                previousTouch.x = touch.pageX;
                previousTouch.y = touch.pageY;
            }, {passive: false});

            cameraZone.addEventListener('touchmove', function(e) {
                e.preventDefault();
                if (activeTouchId === null) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === activeTouchId) {
                        cameraAngleX -= (touch.pageX - previousTouch.x) * 0.01;
                        cameraAngleY += (touch.pageY - previousTouch.y) * 0.01;
                        cameraAngleY = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, cameraAngleY));
                        previousTouch.x = touch.pageX;
                        previousTouch.y = touch.pageY;
                        break;
                    }
                }
            }, {passive: false});

            cameraZone.addEventListener('touchend', function(e) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) { activeTouchId = null; break; }
                }
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (playerMesh) {
                if (Math.abs(moveVector.x) > 0 || Math.abs(moveVector.z) > 0) {
                    const c = Math.cos(cameraAngleX), s = Math.sin(cameraAngleX);
                    const realX = moveVector.x * c + moveVector.z * s;
                    const realZ = -moveVector.x * s + moveVector.z * c;

                    playerMesh.position.x += realX * playerSpeed;
                    playerMesh.position.z += realZ * playerSpeed;
                    playerMesh.lookAt(new THREE.Vector3(playerMesh.position.x + realX, playerMesh.position.y, playerMesh.position.z + realZ));
                }

                camera.position.x = playerMesh.position.x + cameraDistance * Math.sin(cameraAngleX) * Math.cos(cameraAngleY);
                camera.position.y = playerMesh.position.y + cameraDistance * Math.sin(cameraAngleY);
                camera.position.z = playerMesh.position.z + cameraDistance * Math.cos(cameraAngleX) * Math.cos(cameraAngleY);
                camera.lookAt(playerMesh.position);
            }
            renderer.render(scene, camera);
        }

        let user = tg.initDataUnsafe && tg.initDataUnsafe.user;
        let telegramId = user ? user.id.toString() : "123456789";
        let firstName = user ? (user.first_name || "Герой") : "Тестовый Герой";
        const API_URL = '/.netlify/functions/api';
        let is3DInitialized = false;

        function syncWithServer(action = '', classType = '') {
            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: telegramId, username: firstName, action: action, class_type: classType })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    if (data.needs_creation) {
                        document.getElementById('creation-screen').style.display = 'flex';
                        document.getElementById('game-screen').style.display = 'none';
                    } else if (data.user) {
                        document.getElementById('creation-screen').style.display = 'none';
                        document.getElementById('game-screen').style.display = 'block';
                        updateUI(data.user);
                        if (!is3DInitialized) { init3DWorld(); is3DInitialized = true; }
                    }
                }
            })
            .catch(err => console.error('Ошибка:', err));
        }

        function createCharacter(classType) {
            syncWithServer('create', classType);
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        function updateUI(u) {
            document.getElementById('username').innerText = u.username;
            document.getElementById('class_type').innerText = u.class_type;
            document.getElementById('level').innerText = u.level;
            document.getElementById('exp').innerText = u.exp;
            document.getElementById('adena').innerText = u.adena;
            document.getElementById('hp').innerText = u.hp;
            document.getElementById('max_hp').innerText = u.max_hp;
            document.getElementById('mp').innerText = u.mp;
            document.getElementById('max_mp').innerText = u.max_mp;

            let hpPercent = Math.max(0, Math.min(100, (u.hp / u.max_hp) * 100));
            let mpPercent = Math.max(0, Math.min(100, (u.mp / u.max_mp) * 100));
            document.getElementById('hp-bar-width').style.width = hpPercent + '%';
            document.getElementById('mp-bar-width').style.width = mpPercent + '%';

            let avatarUrl = 'img/humanvoin.png'; 
            if (u.class_type === 'warrior') avatarUrl = 'img/humanvoin.png';
            if (u.class_type === 'archer') avatarUrl = 'img/elfluk.png';
            if (u.class_type === 'mage') avatarUrl = 'img/humanmaq.png';
            if (u.class_type === 'overlord') avatarUrl = 'img/qaraelftx.png';
            document.getElementById('hud-avatar').src = avatarUrl;
        }

        function sendAction(actionType) {
            syncWithServer(actionType);
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
            if (playerMesh) { playerMesh.rotation.y += Math.PI * 2; playerMesh.position.y = 2; setTimeout(() => { playerMesh.position.y = 1; }, 150); }
        }

        function useSkill(skillNumber) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            if (playerMesh) {
                if (skillNumber === 1) playerMesh.material.color.setHex(0x5555ff); 
                if (skillNumber === 2) playerMesh.material.color.setHex(0xff5555); 
                if (skillNumber === 3) playerMesh.material.color.setHex(0x55ff55); 
                setTimeout(() => { playerMesh.material.color.setHex(0xd4af37); }, 500); 
            }
        }

        function useItem(itemType) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            if (playerMesh) {
                if (itemType === 'hp') { playerMesh.material.color.setHex(0x00ff00); setTimeout(() => { playerMesh.material.color.setHex(0xd4af37); }, 300); } 
                else if (itemType === 'mp') { playerMesh.material.color.setHex(0x0000ff); setTimeout(() => { playerMesh.material.color.setHex(0xd4af37); }, 300); } 
                else { playerMesh.material.color.setHex(0xffffff); setTimeout(() => { playerMesh.material.color.setHex(0xd4af37); }, 300); }
            }
        }

        syncWithServer();
    </script>
</body>
</html>
